<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="description" content="国内株・米国株の配当観測アプリ">
<link rel="manifest" href="./manifest.webmanifest">
<title>Stock Checker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{position:sticky;top:0;z-index:5;background:#0f172a;color:white;padding:16px 16px 14px}header .title{font-size:22px;font-weight:800}header .sub{font-size:12px;opacity:.7;margin-top:3px}.wrap{padding:12px;max-width:1100px;margin:auto}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.card{background:white;border-radius:12px;padding:11px;box-shadow:0 1px 5px #0000000d}.label{font-size:11px;color:#687386}.value{font-size:18px;font-weight:800;margin-top:3px}.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:10px 13px;font-weight:700;background:#0f172a;color:white}button.secondary{background:white;color:#172033;border:1px solid #d8dee8}.tablebox{background:white;border-radius:14px;overflow:auto;box-shadow:0 1px 5px #0000000d}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:11px 10px;border-bottom:1px solid #edf0f4;text-align:right;white-space:nowrap;font-size:13px}th{position:sticky;top:0;background:#f8fafc;color:#687386;font-size:11px}th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1}.name{font-weight:800}.code{font-size:11px;color:#7a8494}.up{color:#16834b}.down{color:#c43d3d}.badge{display:inline-block;font-size:10px;padding:3px 6px;border-radius:6px;background:#eef2ff}.empty{text-align:center;padding:35px;color:#7a8494}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{background:white;width:100%;border-radius:18px 18px 0 0;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:12px;color:#687386;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d8dee8;border-radius:9px;font-size:15px}.actions{display:flex;gap:8px;margin-top:16px}.actions button{flex:1}.note{font-size:11px;color:#7a8494;margin:12px 2px;line-height:1.5}.status{font-size:11px;margin:8px 2px;color:#687386}@media(min-width:700px){.modal{align-items:center}.sheet{max-width:480px;border-radius:18px}}
</style></head>
<body>
<header><div class="title">📊 Stock Checker</div><div class="sub" id="updated">最終更新：未取得</div></header>
<main class="wrap">
<section class="summary"><div class="card"><div class="label">登録銘柄</div><div class="value" id="count">0</div></div><div class="card"><div class="label">年間配当（税引前）</div><div class="value" id="gross">—</div></div><div class="card"><div class="label">年間配当（実質）</div><div class="value" id="net">—</div></div></section>
<div class="toolbar"><button onclick="openModal()">＋ 銘柄追加</button><button class="secondary" onclick="refreshMarketData()">↻ データ更新</button><button class="secondary" onclick="seed()">サンプル表示</button></div>
<div class="status" id="status">市場データ：未取得</div>
<div class="tablebox"><table><thead><tr><th>銘柄</th><th>株価</th><th>前日比</th><th>配当利回り</th><th>年間配当</th><th>口座</th><th>実質利回り</th><th>実質配当</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="note">※ 銘柄・保有株数・口座情報は端末内に保存します。市場データはGitHub上の <code>data/market-data.json</code> を読む構成に変更しました。今後、APIからこのキャッシュを毎朝9:30に更新します。米国株の実質配当は現時点では米国源泉税10%を仮定し、日本側課税を口座区分に応じて計算する設計です。実運用前に税務仕様を確定します。</div>
</main>
<div class="modal" id="modal"><div class="sheet"><h2>銘柄を追加</h2><div class="field"><label>銘柄コード / ティッカー</label><input id="code" placeholder="9434 / AAPL"></div><div class="field"><label>銘柄名</label><input id="name" placeholder="ソフトバンク / Apple"></div><div class="field"><label>市場</label><select id="market"><option value="JP">🇯🇵 日本</option><option value="US">🇺🇸 米国</option></select></div><div class="field"><label>保有株数</label><input id="shares" type="number" min="0" value="100"></div><div class="field"><label>口座</label><select id="account"><option value="NISA">NISA</option><option value="TAX">特定口座</option><option value="GENERAL">一般口座</option></select></div><div class="actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button onclick="addStock()">追加</button></div></div></div>
<script>
const KEY='stock-checker-stocks', UPDATED='stock-checker-updated';
let stocks=JSON.parse(localStorage.getItem(KEY)||'[]');
let marketData={stocks:{},fx:{USDJPY:null},updatedAt:null,source:null};
const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n||0);
const usd=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n||0);
function taxRate(s){if(s.market==='US')return s.account==='NISA'?0.10:0.10+((1-0.10)*0.20315);return s.account==='NISA'?0:0.20315}
function effectiveDividend(s){return Number(s.dividend||0)*(1-taxRate(s))}
function keyFor(s){return `${s.market}:${String(s.code).toUpperCase()}`}
function applyMarketData(){stocks=stocks.map(s=>{const m=marketData.stocks[keyFor(s)];return m?{...s,...m}:s});render()}
async function refreshMarketData(){const status=document.getElementById('status');status.textContent='市場データを取得中…';try{const r=await fetch('./data/market-data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);marketData=await r.json();applyMarketData();const t=marketData.updatedAt||'未取得';document.getElementById('updated').textContent='最終更新：'+t;localStorage.setItem(UPDATED,t);status.textContent='市場データ：'+(marketData.source||'キャッシュ')+' / '+t;}catch(e){status.textContent='市場データ：取得できませんでした（保存済みデータを表示）';}}
function render(){document.getElementById('count').textContent=stocks.length;let grossJP=0,netJP=0,grossUS=0,netUS=0;const body=document.getElementById('rows');if(!stocks.length){body.innerHTML='<tr><td colspan="9"><div class="empty">銘柄がありません<br>「＋ 銘柄追加」から登録してください</div></td></tr>';}else body.innerHTML=stocks.map((s,i)=>{const effective=effectiveDividend(s);const gross=Number(s.dividend||0);const yieldPct=s.price?gross/s.price*100:0;const netYield=s.price?effective/s.price*100:0;if(s.market==='US'){grossUS+=gross*s.shares;netUS+=effective*s.shares}else{grossJP+=gross*s.shares;netJP+=effective*s.shares}return `<tr><td><div class="name">${esc(s.name)}</div><div class="code">${esc(s.code)} ${s.market==='US'?'🇺🇸':'🇯🇵'}</div></td><td>${s.price==null?'—':s.market==='US'?usd(s.price):yen(s.price)}</td><td class="${Number(s.change||0)>=0?'up':'down'}">${s.change==null?'—':(s.change>=0?'▲ ':'▼ ')+Math.abs(Number(s.change)).toFixed(2)}</td><td>${yieldPct.toFixed(2)}%</td><td>${s.market==='US'?usd(gross):yen(gross)}</td><td><span class="badge">${s.account==='NISA'?'NISA':s.account==='TAX'?'特定':'一般'}</span></td><td>${netYield.toFixed(2)}%</td><td>${s.market==='US'?usd(effective):yen(effective)}</td><td><button class="secondary" onclick="removeStock(${i})">削除</button></td></tr>`}).join('');document.getElementById('gross').textContent=`${yen(grossJP)} / ${usd(grossUS)}`;document.getElementById('net').textContent=`${yen(netJP)} / ${usd(netUS)}`;save()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(KEY,JSON.stringify(stocks))}function openModal(){document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function addStock(){const s={code:document.getElementById('code').value.trim().toUpperCase(),name:document.getElementById('name').value.trim(),market:document.getElementById('market').value,shares:Number(document.getElementById('shares').value)||0,account:document.getElementById('account').value,price:null,change:null,dividend:0};if(!s.code||!s.name){alert('コードと銘柄名を入力してください');return}stocks.push(s);applyMarketData();closeModal();['code','name'].forEach(x=>document.getElementById(x).value='')}
function removeStock(i){if(confirm(stocks[i].name+'を削除しますか？')){stocks.splice(i,1);render()}}
function seed(){stocks=[{code:'9434',name:'ソフトバンク',market:'JP',shares:100,account:'NISA',price:215,change:1.2,dividend:8.6},{code:'8593',name:'三菱HCキャピタル',market:'JP',shares:100,account:'TAX',price:1124,change:-8,dividend:43},{code:'AAPL',name:'Apple',market:'US',shares:10,account:'NISA',price:230,change:1.5,dividend:1.04}];save();render()}
document.getElementById('updated').textContent='最終更新：'+(localStorage.getItem(UPDATED)||'未取得');render();refreshMarketData();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
